<section class="chat-composer" id="intake-step-task" aria-label="发起任务">
  <form class="intake-task" id="intake-composer">
    <label class="intake-objective">
      <span class="sr-only">任务消息</span>
      <textarea id="intake-objective" rows="3" required aria-describedby="chat-send-hint"
        placeholder="描述想做的改动，以及需要保留的行为…"></textarea>
    </label>

    <details class="disclose chat-repository" id="chat-repository">
      <summary id="chat-repo-label">选择 Git 仓库</summary>
      <div id="intake-repos" class="repo-cards"></div>
      <button type="button" class="ghost small" id="intake-other-repo">输入仓库路径</button>
      <label class="sr-only" for="intake-repo-path">Git 仓库绝对路径</label>
      <input id="intake-repo-path" class="hidden" placeholder="/absolute/path/to/repo" />
    </details>

    <details class="disclose">
      <summary>绑定已预检的行为验收（可选）</summary>
      <label class="intake-objective">
        <span class="intake-label">行为验收编号</span>
        <input id="intake-requirement-check-id" maxlength="128"
               autocomplete="off" placeholder="requirement_…" />
      </label>
      <label><input type="checkbox" id="intake-require-behavior-paths" />
        必须验收完整用户路径（入口 → 状态变化 → 可观察结果）</label>
      <p class="muted">需为相同仓库、目标、写入范围和当前提交的 READY 收据。
        要求完整路径时，收据须同时覆盖变更和必须保留的行为。
        执行只向模型提供公开路径与汇总结果，不发送验收代码或输入。</p>
    </details>

    <div class="chat-send-row">
      <div class="chat-model"><button type="button" class="ghost small" data-model-open>模型设置</button><span id="workflow-model-label" class="muted">尚未读取模型连接</span></div>
      <button type="submit" id="intake-start" class="primary">发送 <span aria-hidden="true">↑</span></button>
    </div>
    <span id="chat-send-hint" class="muted chat-key-hint">Enter 发送 · Shift+Enter 换行</span>
  </form>
</section>

<section class="panel chat-question" id="intake-step-questions" aria-label="需求澄清" hidden>
  <header class="panel-head">
    <div>
      <span class="chat-author">Daedalus</span>
      <h2 id="intake-question-title">模型的问题</h2>
      <p class="panel-sub" id="intake-question-sub"></p>
    </div>
    <div class="controls">
      <button type="button" class="ghost small" id="intake-back">← 上一题</button>
      <button type="button" class="ghost small" id="intake-skip">跳过这一题</button>
    </div>
  </header>

  <div class="intake-progress" id="intake-progress"></div>
  <div class="intake-question" id="intake-question"></div>
  <div class="intake-options" id="intake-options"></div>

  <details class="disclose" id="intake-free-wrap" hidden>
    <summary>自己写一个答案</summary>
    <div class="intake-free">
      <input id="intake-free-text" placeholder="按该字段的格式写；多个值用英文逗号分隔" />
      <button type="button" class="ghost" id="intake-free-submit">用这个答案</button>
    </div>
  </details>

  <div id="intake-rejections" class="intake-note" hidden></div>
</section>
