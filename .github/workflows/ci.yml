name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      DAEDALUS_SANDBOX_IMAGE: daedalus-ci-python:3.12
    strategy:
      fail-fast: false
      matrix:
        # macOS is included deliberately: the Seatbelt driver is macOS-only, and a matrix that
        # never runs it is a driver nobody has verified.
        os: [ubuntu-24.04, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build the isolated task test environment
        if: runner.os == 'Linux'
        run: docker build --file .github/sandbox.Dockerfile --tag "$DAEDALUS_SANDBOX_IMAGE" .github

      - name: Report the isolation actually available
        run: daedalus preflight --workspace "$RUNNER_TEMP/daedalus-ci" || true

      - name: Behavioural suite
        # These tests ARE the Spec §25 permission, boundary, secret-leak, idempotency and
        # git-conflict checks. No model gateway is contacted.
        run: python -m pytest -q

      - name: Nine-scenario closed-loop demo
        run: python scripts/run_demo.py

      - name: Live check (real uvicorn, real HTTP, console render functions)
        # The suite drives the app in-process; this boots `daedalus serve` as a separate
        # process, drives a run over real HTTP through a loopback gateway, and executes the
        # console's render functions in Node against the payloads it fetched. It is the only
        # check that proves the served system rather than the imported one.
        run: python scripts/live_check.py

      - name: Lint correctness (blocking)
        run: python -m ruff check src tests --select E9,F63,F7,F82

      - name: Lint (advisory)
        # Style cleanup remains incremental; correctness diagnostics above block CI.
        run: python -m ruff check . || true

  release-diagnostics:
    name: Development release diagnostics
    runs-on: ubuntu-24.04
    needs: verify
    env:
      DAEDALUS_SANDBOX_IMAGE: daedalus-ci-python:3.12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build the isolated task test environment
        run: docker build --file .github/sandbox.Dockerfile --tag "$DAEDALUS_SANDBOX_IMAGE" .github
      - name: Build a workspace with a verified snapshot
        run: |
          daedalus status --workspace "$RUNNER_TEMP/daedalus-gate"
          daedalus backup --workspace "$RUNNER_TEMP/daedalus-gate" --label ci
      - name: Diagnostic checks (not production approval)
        # Production remains blocked until deployment-bound security evidence exists.
        # This job reports development health and must not authorize deployment.
        run: |
          # Synthetic, per-job identities; never use production signing secrets in CI.
          export CI_OWNER_SECRET="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          export CI_REVIEWER_SECRET="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$CI_OWNER_SECRET"
          echo "::add-mask::$CI_REVIEWER_SECRET"
          daedalus owners add --workspace "$RUNNER_TEMP/daedalus-gate" \
            --owner-id ci-owner --role owner --secret-env CI_OWNER_SECRET
          daedalus owners add --workspace "$RUNNER_TEMP/daedalus-gate" \
            --owner-id ci-reviewer --role reviewer --secret-env CI_REVIEWER_SECRET
          daedalus release-gate --mode development --workspace "$RUNNER_TEMP/daedalus-gate"

  package:
    name: Build the wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
      - name: Install the wheel into a clean environment and run it
        # Installing the artifact that would actually ship, not the source tree.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/daedalus --version
          /tmp/verify/bin/python scripts/check_installed_console.py --expected-root /tmp/verify
          /tmp/verify/bin/daedalus init --path /tmp/verify/daedalus.toml --workspace /tmp/verify/ws
          /tmp/verify/bin/daedalus config --config /tmp/verify/daedalus.toml >/dev/null
          /tmp/verify/bin/daedalus preflight --workspace /tmp/verify/ws || true
      - uses: actions/upload-artifact@v7
        with:
          name: daedalus-wheel
          path: dist/*.whl
