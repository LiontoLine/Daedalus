[project]
name = "daedalus"
version = "0.1.0"
description = "A deterministic control plane that confines uncertain model capability inside a verifiable, recoverable, auditable engineering system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "packaging>=24.2,<27",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "build>=1.2", "ruff>=0.6"]
retrieval = ["fastembed>=0.6,<1"]

[project.scripts]
daedalus = "daedalus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"daedalus.service" = ["templates/*.html", "static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
addopts = ["-q", "-ra", "--strict-markers", "--strict-config"]
markers = [
    "e2e: end-to-end runs against a real Git repository",
    "slow: slower tests that exercise subprocess execution",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# `BLE` is enabled because the codebase already carries `# noqa: BLE001` on every
# deliberate broad `except`. Without the rule those directives mean nothing, and a new
# unannotated broad except would go unnoticed — which in this codebase is how a failure
# path silently swallows an error.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
# The demo project is intentionally buggy input, not code we maintain.
"examples/demo_project/**" = ["E501", "F841", "F401"]
# The bundled demo module embeds whole source files as string literals on purpose.
"src/daedalus/demo.py" = ["E501"]
# Tests legitimately import fixtures and helpers that only the test runner resolves.
"tests/**" = ["E501", "F401"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_configs = true

[tool.coverage.run]
source = ["src/daedalus"]
omit = ["*/tests/*"]
